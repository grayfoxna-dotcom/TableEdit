<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableEdit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Chỉnh màu viền và màu focus của ô nhập ở đây */
    :root {
      /* Màu viền mặc định của ô nhập */
      --sheet-cell-border-color: rgb(255, 255, 255);
      /* Màu nền mặc định của ô nhập */
      --sheet-cell-background-color: rgb(255, 255, 255);
      /* Màu viền khi ô đang được focus */
      --sheet-cell-focus-border-color: rgb(37 99 235);
      /* Màu nền khi ô đang được focus */
      --sheet-cell-focus-background-color: rgb(255, 255, 255);
    }

    /* Thanh cuộn chính của bảng */
    .sheet-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgb(148 163 184) rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    .sheet-scroll::-webkit-scrollbar-track {
      background: rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar-thumb {
      background: rgb(148 163 184);
      border-radius: 9999px;
      border: 3px solid rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar-thumb:hover {
      background: rgb(100 116 139);
    }

    /* Dùng zoom thay vì transform để sticky hoạt động ổn hơn */
    .sheet-zoom {
      zoom: 1;
    }

    .sheet-cell {
      position: relative;
      min-width: 9rem;
      height: 3rem;
      overflow: hidden;
      vertical-align: top;
      background: var(--sheet-cell-background-color);
    }

    .cell-control {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 1px solid var(--sheet-cell-border-color);
      border-radius: 0;
      background: var(--sheet-cell-background-color);
      padding: 0.2rem 0.35rem;
      font-size: 0.875rem;
      color: rgb(15 23 42);
      outline: none;
    }

    .cell-control:focus {
      border-color: var(--sheet-cell-focus-border-color);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sheet-cell-focus-border-color) 35%, transparent);
      background: var(--sheet-cell-focus-background-color);
    }

    .cell-control::-webkit-scrollbar {
      display: none;
    }

    .cell-control {
      scrollbar-width: none;
    }

    .cell-control[type="range"] {
      padding: 0;
      background: transparent;
      border-color: transparent;
    }

    .cell-control[type="color"] {
      padding: 0;
      border-color: transparent;
      background: transparent;
    }

    .cell-control[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: 1px solid var(--sheet-cell-border-color);
    }

    .cell-control[type="checkbox"]:focus {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sheet-cell-focus-border-color) 20%, transparent);
      border-color: var(--sheet-cell-focus-border-color);
      background: transparent;
    }

    .resize-handle-col {
      position: absolute;
      top: 0;
      right: -7px;
      width: 14px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 40;
      background: transparent;
    }

    .resize-handle-row {
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;
      height: 14px;
      cursor: row-resize;
      user-select: none;
      z-index: 40;
      background: transparent;
    }
  </style>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-900">
  <div class="flex h-screen w-screen flex-col">
    <header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur">
      <div>
        <h1 class="text-lg font-semibold tracking-wide">TableEdit</h1>
        <p class="text-xs text-slate-500">Bảng toàn màn hình, chỉnh sửa trực tiếp, phóng to thu nhỏ như Excel</p>
      </div>

      <div class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 shadow-sm">
        <button id="zoomOut" class="rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 transition hover:bg-slate-100">-</button>
        <div class="min-w-20 text-center text-sm font-medium text-slate-700"><span id="zoomLabel">100%</span></div>
        <button id="zoomIn" class="rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 transition hover:bg-slate-100">+</button>
        <input id="zoomRange" type="range" min="50" max="200" value="100" class="w-36 accent-blue-500" />
      </div>
    </header>

    <main class="relative flex-1 overflow-hidden">
      <div class="relative flex h-full w-full flex-col p-4">
        <div class="mb-3 flex items-center justify-between text-xs text-slate-500">
          <span>Nhấn trực tiếp vào ô để sửa nội dung</span>
          <span>Ctrl + cuộn chuột để đổi zoom</span>
        </div>

        <div id="sheetViewport" class="sheet-scroll relative flex-1 overflow-auto border border-slate-200 bg-white shadow-xl shadow-slate-200/60">
          <div id="sheetStage" class="relative">
            <div id="sheetWrap" class="sheet-zoom">
              <table class="w-max table-fixed border-separate border-spacing-0 text-sm">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Chuyển số cột thành tên kiểu Excel: A, B, C ... Z, AA, AB ...
    function getColumnName(index) {
      let name = '';
      let current = index + 1;

      while (current > 0) {
        const remainder = (current - 1) % 26;
        name = String.fromCharCode(65 + remainder) + name;
        current = Math.floor((current - 1) / 26);
      }

      return name;
    }

    const COLS = 26;
    const DEFAULT_ZOOM = 100;
    const MIN_ZOOM = 50;
    const MAX_ZOOM = 200;
    const STEP_ZOOM = 10;
    const DEFAULT_COL_WIDTH = 144;
    const DEFAULT_ROW_HEIGHT = 48;
    const SAMPLE_ROW_HEIGHT = 76;
    const MIN_COL_WIDTH = 80;
    const MIN_ROW_HEIGHT = 32;

    const COLUMN_SCHEMA = [
      { type: 'text', sampleValue: 'Chữ', emptyValue: '' },
      { type: 'textarea', sampleValue: 'Nhiều\nDòng', emptyValue: '' },
      { type: 'number', sampleValue: '123', emptyValue: '' },
      { type: 'date', sampleValue: '2026-06-09', emptyValue: '' },
      { type: 'time', sampleValue: '08:30', emptyValue: '' },
      { type: 'datetime-local', sampleValue: '2026-06-09T08:30', emptyValue: '' },
      { type: 'email', sampleValue: 'hello@example.com', emptyValue: '' },
      { type: 'tel', sampleValue: '0901234567', emptyValue: '' },
      { type: 'url', sampleValue: 'https://example.com', emptyValue: '' },
      { type: 'color', sampleValue: '#3b82f6', emptyValue: '#ffffff' },
      { type: 'range', sampleValue: '75', emptyValue: '50', min: '0', max: '100' },
      { type: 'checkbox', sampleValue: true, emptyValue: false },
      {
        type: 'select',
        sampleValue: 'B',
        emptyValue: '',
        options: [
          { value: '', label: 'Chọn' },
          { value: 'A', label: 'A' },
          { value: 'B', label: 'B' },
          { value: 'C', label: 'C' },
        ],
      },
      { type: 'password', sampleValue: 'matkhau', emptyValue: '' },
      { type: 'month', sampleValue: '2026-06', emptyValue: '' },
      { type: 'week', sampleValue: '2026-W24', emptyValue: '' },
      { type: 'search', sampleValue: 'Tìm kiếm', emptyValue: '' },
      { type: 'text', sampleValue: 'Văn bản', emptyValue: '' },
      { type: 'number', sampleValue: '456', emptyValue: '' },
      { type: 'textarea', sampleValue: 'Dòng 1\nDòng 2', emptyValue: '' },
      { type: 'date', sampleValue: '2026-06-10', emptyValue: '' },
      { type: 'time', sampleValue: '18:45', emptyValue: '' },
      {
        type: 'select',
        sampleValue: 'C',
        emptyValue: '',
        options: [
          { value: '', label: 'Chọn' },
          { value: 'A', label: 'A' },
          { value: 'B', label: 'B' },
          { value: 'C', label: 'C' },
        ],
      },
      { type: 'checkbox', sampleValue: false, emptyValue: false },
      { type: 'url', sampleValue: 'https://openai.com', emptyValue: '' },
      { type: 'text', sampleValue: 'Cuối dòng', emptyValue: '' },
    ];

    const sheetViewport = document.getElementById('sheetViewport');
    const sheetWrap = document.getElementById('sheetWrap');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const zoomLabel = document.getElementById('zoomLabel');
    const zoomRange = document.getElementById('zoomRange');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');

    let zoom = DEFAULT_ZOOM;
    const colWidths = Array.from({ length: COLS }, () => DEFAULT_COL_WIDTH);
    const rowHeights = [];

    function setZoom(nextZoom) {
      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      sheetWrap.style.zoom = String(zoom / 100);
      zoomLabel.textContent = `${zoom}%`;
      zoomRange.value = String(zoom);
    }

    function applyColumnWidth(colIndex, width) {
      const nextWidth = Math.max(MIN_COL_WIDTH, width);
      colWidths[colIndex] = nextWidth;

      document.querySelectorAll(`[data-col="${colIndex}"]`).forEach((el) => {
        el.style.width = `${nextWidth}px`;
        el.style.minWidth = `${nextWidth}px`;
        el.style.maxWidth = `${nextWidth}px`;
      });
    }

    function applyRowHeight(rowIndex, height) {
      const nextHeight = Math.max(MIN_ROW_HEIGHT, height);
      rowHeights[rowIndex] = nextHeight;

      document.querySelectorAll(`[data-row="${rowIndex}"]`).forEach((el) => {
        el.style.height = `${nextHeight}px`;
        el.style.minHeight = `${nextHeight}px`;
        el.style.maxHeight = `${nextHeight}px`;
      });
    }

    function rowHasContent(rowIndex) {
      const row = tableBody.querySelector(`tr[data-row="${rowIndex}"]`);
      if (!row) return false;

      return Array.from(row.querySelectorAll('[data-cell-control]')).some((control) => {
        if (control.type === 'checkbox' || control.type === 'radio') {
          return control.checked !== (control.dataset.initialValue === '1');
        }

        if (control.tagName === 'SELECT') {
          return control.value !== control.dataset.initialValue;
        }

        if (control.tagName === 'TEXTAREA') {
          return control.value !== control.dataset.initialValue;
        }

        return String(control.value ?? '') !== String(control.dataset.initialValue ?? '');
      });
    }

    function createControl(schema, value) {
      if (schema.type === 'textarea') {
        const textarea = document.createElement('textarea');
        textarea.className = 'cell-control';
        textarea.dataset.cellControl = 'true';
        textarea.dataset.initialValue = value ?? '';
        textarea.rows = 2;
        textarea.value = value ?? '';
        textarea.addEventListener('focus', () => {
          textarea.scrollTop = 0;
          textarea.scrollLeft = 0;
        });
        textarea.addEventListener('blur', () => {
          textarea.scrollTop = 0;
          textarea.scrollLeft = 0;
        });
        return textarea;
      }

      if (schema.type === 'select') {
        const select = document.createElement('select');
        select.className = 'cell-control';
        select.dataset.cellControl = 'true';
        select.dataset.initialValue = value ?? '';
        (schema.options || []).forEach((option) => {
          const opt = document.createElement('option');
          opt.value = option.value;
          opt.textContent = option.label;
          select.appendChild(opt);
        });
        select.value = value ?? '';
        return select;
      }

      if (schema.type === 'checkbox') {
        const wrapper = document.createElement('div');
        wrapper.className = 'cell-control flex items-center justify-center';
        wrapper.style.padding = '0';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'h-4 w-4 accent-blue-600';
        checkbox.dataset.cellControl = 'true';
        checkbox.dataset.initialValue = value ? '1' : '0';
        checkbox.checked = Boolean(value);
        wrapper.appendChild(checkbox);
        return wrapper;
      }

      const input = document.createElement('input');
      input.type = schema.type;
      input.className = 'cell-control';
      input.dataset.cellControl = 'true';
      input.dataset.initialValue = value ?? '';
      input.value = value ?? '';

      if (schema.type === 'range') {
        input.className = 'cell-control w-full';
        if (schema.min != null) input.min = schema.min;
        if (schema.max != null) input.max = schema.max;
      }

      if (schema.type === 'color') {
        input.className = 'cell-control w-full';
        input.style.padding = '0';
      }

      input.addEventListener('focus', () => {
        input.scrollTop = 0;
        input.scrollLeft = 0;
      });

      input.addEventListener('blur', () => {
        input.scrollTop = 0;
        input.scrollLeft = 0;
      });

      return input;
    }

    function setupColumnResize(handle, colIndex) {
      let startX = 0;
      let startWidth = 0;

      const onMouseMove = (event) => {
        applyColumnWidth(colIndex, startWidth + (event.clientX - startX));
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startX = event.clientX;
        startWidth = colWidths[colIndex];
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function setupRowResize(handle, rowIndex) {
      let startY = 0;
      let startHeight = 0;

      const onMouseMove = (event) => {
        applyRowHeight(rowIndex, startHeight + (event.clientY - startY));
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startY = event.clientY;
        startHeight = rowHeights[rowIndex];
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function appendRow(preset = false) {
      const rowIndex = rowHeights.length;
      const rowHeight = preset ? SAMPLE_ROW_HEIGHT : DEFAULT_ROW_HEIGHT;
      rowHeights.push(rowHeight);

      const tr = document.createElement('tr');
      tr.dataset.row = String(rowIndex);
      tr.style.height = `${rowHeight}px`;

      const rowHead = document.createElement('th');
      rowHead.dataset.rowLabel = 'true';
      rowHead.textContent = String(rowIndex + 1);
      rowHead.className = [
        'relative sticky left-0 z-20 border-b border-r border-slate-200 bg-slate-100 px-3 text-left text-xs font-semibold text-slate-500 overflow-hidden',
      ].join(' ');
      rowHead.style.width = '4rem';
      rowHead.style.minWidth = '4rem';
      rowHead.style.maxWidth = '4rem';
      rowHead.style.height = `${rowHeight}px`;

      const rowHandle = document.createElement('div');
      rowHandle.className = 'resize-handle-row';
      rowHead.appendChild(rowHandle);
      setupRowResize(rowHandle, rowIndex);
      tr.appendChild(rowHead);

      COLUMN_SCHEMA.forEach((schema, colIndex) => {
        const td = document.createElement('td');
        td.className = 'sheet-cell border-b border-r border-slate-200 bg-white text-slate-900 overflow-hidden';
        td.dataset.col = String(colIndex);
        td.dataset.row = String(rowIndex);
        td.style.width = `${colWidths[colIndex]}px`;
        td.style.minWidth = `${colWidths[colIndex]}px`;
        td.style.maxWidth = `${colWidths[colIndex]}px`;
        td.style.height = `${rowHeight}px`;

        const control = createControl(schema, preset ? schema.sampleValue : schema.emptyValue);
        const onValueChange = () => {
          if (rowIndex === rowHeights.length - 1 && rowHasContent(rowIndex)) {
            appendRow(false);
          }
        };

        control.addEventListener('input', onValueChange);
        control.addEventListener('change', onValueChange);

        td.appendChild(control);
        tr.appendChild(td);
      });

      tableBody.appendChild(tr);
      return tr;
    }

    function buildTable() {
      const headRow = document.createElement('tr');

      const corner = document.createElement('th');
      corner.textContent = '';
      corner.className = [
        'relative sticky left-0 top-0 z-30 h-10 min-w-16 border-b border-r border-slate-200 bg-slate-100 px-3 text-left text-xs font-semibold text-slate-500',
      ].join(' ');
      headRow.appendChild(corner);

      for (let col = 0; col < COLS; col += 1) {
        const th = document.createElement('th');
        th.dataset.col = String(col);
        th.textContent = getColumnName(col);
        th.className = [
          'relative sticky top-0 z-20 h-10 border-b border-r border-slate-200 bg-slate-100 px-3 text-left text-xs font-semibold text-slate-500',
        ].join(' ');

        th.style.width = `${colWidths[col]}px`;
        th.style.minWidth = `${colWidths[col]}px`;
        th.style.maxWidth = `${colWidths[col]}px`;

        const handle = document.createElement('div');
        handle.className = 'resize-handle-col';
        th.appendChild(handle);
        setupColumnResize(handle, col);

        headRow.appendChild(th);
      }

      tableHead.appendChild(headRow);
      appendRow(true);
      appendRow(false);
    }

    zoomRange.addEventListener('input', (event) => {
      setZoom(Number(event.target.value));
    });

    zoomInBtn.addEventListener('click', () => {
      setZoom(zoom + STEP_ZOOM);
    });

    zoomOutBtn.addEventListener('click', () => {
      setZoom(zoom - STEP_ZOOM);
    });

    sheetViewport.addEventListener('wheel', (event) => {
      if (!event.ctrlKey) return;
      event.preventDefault();

      const direction = event.deltaY < 0 ? 1 : -1;
      setZoom(zoom + direction * STEP_ZOOM);
    }, { passive: false });

    buildTable();
    setZoom(DEFAULT_ZOOM);
  </script>
</body>
</html>
