<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableEdit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Chỉnh màu viền và màu focus của ô nhập ở đây */
    :root {
      /* Màu nền mặc định của ô trên bảng */
      --sheet-cell-background-color: rgb(255, 255, 255);
      /* Màu nền mặc định của control nhập bên trong ô */
      --sheet-cell-control-background-color: rgb(255, 255, 255);
      /* Màu viền mặc định của control nhập bên trong ô */
      --sheet-cell-control-border-color: rgb(255, 255, 255);
      /* Màu viền khi control nhập đang focus */
      --sheet-cell-control-focus-border-color: rgb(37 99 235);
      /* Màu nền khi control nhập đang focus */
      --sheet-cell-control-focus-background-color: rgb(255, 255, 255);
      /* Màu nền của header bảng */
      --sheet-table-header-background-color: rgb(255, 255, 255);
      /* Màu chữ của header bảng */
      --sheet-table-header-text-color: rgb(0, 0, 0);
      /* Màu nền riêng của cột số thứ tự */
      --sheet-table-row-number-background-color: rgb(255, 255, 255);
      /* Màu chữ riêng của cột số thứ tự */
      --sheet-table-row-number-text-color: rgb(0, 0, 0);
      /* Màu viền chung của bảng */
      --sheet-table-border-color: rgb(236, 236, 236);
    }

    /* Thanh cuộn chính của bảng */
    .sheet-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgb(148 163 184) rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar {
      width: 12px;
      height: 12px;
    }

    .sheet-scroll::-webkit-scrollbar-track {
      background: rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar-thumb {
      background: rgb(148 163 184);
      border-radius: 9999px;
      border: 3px solid rgb(241 245 249);
    }

    .sheet-scroll::-webkit-scrollbar-thumb:hover {
      background: rgb(100 116 139);
    }

    /* Tăng độ mượt khi cuộn bằng tay trên điện thoại */
    .sheet-scroll {
      -webkit-overflow-scrolling: touch;
    }

    /* Dùng zoom thay vì transform để sticky hoạt động ổn hơn */
    .sheet-zoom {
      zoom: 1;
    }

    .sheet-cell {
      position: relative;
      min-width: 9rem;
      height: 3rem;
      overflow: hidden;
      vertical-align: top;
      background: var(--sheet-cell-background-color);
      border-color: var(--sheet-table-border-color);
    }

    .sheet-table-header {
      background: var(--sheet-table-header-background-color);
      border-color: var(--sheet-table-border-color);
      color: var(--sheet-table-header-text-color);
    }

    /* Ô group header ở hàng trên cùng dùng chung màu với header */
    .sheet-table-group-header {
      background: var(--sheet-table-header-background-color);
      border-color: var(--sheet-table-border-color);
      color: var(--sheet-table-header-text-color);
    }

    .sheet-row-header {
      background: var(--sheet-table-row-number-background-color);
      border-color: var(--sheet-table-border-color);
      color: var(--sheet-table-row-number-text-color);
    }

    /* Ô action của từng dòng dùng nền như ô dữ liệu để nút không bị nhìn như header */
    .sheet-action-cell {
      background: var(--sheet-cell-background-color);
      border-color: var(--sheet-table-border-color);
      color: rgb(15 23 42);
    }

    /* Nút action dạng phẳng, nhỏ gọn để không chiếm hết chiều cao ô */
    .sheet-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: center;
      flex: 0 0 auto;
      min-width: 0;
      height: 1.5rem;
      padding: 0 0.5rem;
      border: 1px solid transparent;
      border-radius: 0;
      box-sizing: border-box;
      background-clip: padding-box;
      font-size: 0.6875rem;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease,
        transform 0.15s ease;
    }

    .sheet-action-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sheet-cell-control-focus-border-color) 22%, transparent);
    }

    .sheet-corner-cell {
      background: var(--sheet-table-header-background-color);
      border-color: var(--sheet-table-border-color);
      color: var(--sheet-table-header-text-color);
    }

    /* Viền ngoài khung bảng dùng chung màu với viền của các ô */
    #sheetViewport {
      border-color: var(--sheet-table-border-color);
      width: var(--sheet-viewport-width, 100%);
      max-height: var(--sheet-viewport-max-height, none);
      align-self: flex-start;
    }

    .viewport-panel {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-radius: 1rem;
      border: 1px solid rgb(226 232 240);
      background: rgb(248 250 252);
      padding: 0.5rem 0.75rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
    }

    .viewport-panel label {
      font-size: 0.75rem;
      font-weight: 600;
      color: rgb(71 85 105);
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .viewport-panel {
        display: none;
      }
    }

    .cell-control {
      display: block;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 1px solid var(--sheet-cell-control-border-color);
      border-radius: 0;
      background: var(--sheet-cell-control-background-color);
      padding: 0.2rem 0.35rem;
      font-size: 0.875rem;
      color: rgb(15 23 42);
      outline: none;
    }

    .cell-control:focus {
      border-color: var(--sheet-cell-control-focus-border-color);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sheet-cell-control-focus-border-color) 35%, transparent);
      background: var(--sheet-cell-control-focus-background-color);
    }

    .cell-control::-webkit-scrollbar {
      display: none;
    }

    .cell-control {
      scrollbar-width: none;
    }

    /* Ẩn núm kéo mặc định của textarea để giữ giao diện phẳng như bảng tính */
    textarea.cell-control {
      resize: none;
    }

    .cell-control[type="range"] {
      padding: 0;
      background: transparent;
      border-color: transparent;
    }

    .cell-control[type="color"] {
      padding: 0;
      border-color: transparent;
      background: transparent;
    }

    .cell-control[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      margin: 0;
      padding: 0;
      border-radius: 0;
      border: 1px solid var(--sheet-cell-control-border-color);
    }

    .cell-control[type="checkbox"]:focus {
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sheet-cell-control-focus-border-color) 20%, transparent);
      border-color: var(--sheet-cell-control-focus-border-color);
      background: transparent;
    }

    /* Danh sách checkbox/radio trong một ô */
    .cell-control-list {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      width: 100%;
      height: 100%;
      overflow: auto;
      box-sizing: border-box;
      scrollbar-width: none;
    }

    .cell-control-list::-webkit-scrollbar {
      display: none;
    }

    .cell-control-list-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      line-height: 1.2;
      width: 100%;
      min-width: 0;
      white-space: normal;
      word-break: break-word;
    }

    .resize-handle-col {
      position: absolute;
      top: 0;
      right: -7px;
      width: 14px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      z-index: 40;
      background: transparent;
    }

    .resize-handle-row {
      position: absolute;
      left: 0;
      bottom: -7px;
      width: 100%;
      height: 14px;
      cursor: row-resize;
      user-select: none;
      z-index: 40;
      background: transparent;
    }

    /* Màn hình nhỏ: ẩn cụm zoom vì mobile luôn chạy ở tỉ lệ 100% */
    @media (max-width: 768px) {
      .zoom-panel {
        display: none;
      }
    }

    /* Chế độ mobile được JS gắn vào body để chủ động bật/tắt layout */
    body.is-mobile-layout .zoom-panel {
      display: none !important;
    }

    body.is-mobile-layout #sheetViewport {
      display: none !important;
    }

    body.is-mobile-layout .mobile-form-viewport {
      display: block !important;
    }

    /* Chế độ form trên điện thoại */
    .mobile-form-viewport {
      display: none;
      padding: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: rgb(248 250 252);
    }

    .mobile-form-section {
      display: grid;
      gap: 1rem;
    }

    .mobile-row-card {
      display: grid;
      gap: 0.85rem;
      padding: 1rem;
      border: 1px solid var(--sheet-table-border-color);
      background: rgb(255 255 255);
    }

    .mobile-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .mobile-row-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: rgb(15 23 42);
    }

    .mobile-row-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem;
    }

    /* Nút action ở mobile cũng giữ kiểu phẳng, không bo tròn lớn */
    .mobile-row-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      height: 1.75rem;
      padding: 0 0.55rem;
      border: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      font-size: 0.6875rem;
      font-weight: 600;
      color: rgb(51 65 85);
      line-height: 1;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease,
        transform 0.15s ease;
    }

    .mobile-row-action-button:hover {
      background: rgb(248 250 252);
    }

    .mobile-row-action-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--sheet-cell-control-focus-border-color) 22%, transparent);
    }

    .mobile-row-action-button:active {
      transform: translateY(1px);
    }

    .mobile-fieldset {
      display: grid;
      gap: 0.75rem;
      padding: 0.85rem;
      border: 1px solid var(--sheet-table-border-color);
      background: rgb(248 250 252);
    }

    .mobile-fieldset > legend {
      padding: 0 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sheet-table-header-text-color);
    }

    .mobile-field-row {
      display: grid;
      gap: 0.35rem;
    }

    .mobile-field-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: rgb(71 85 105);
    }

    /* Tăng cảm giác như form thật khi xem trên điện thoại */
    .mobile-form-viewport .cell-control {
      min-height: 3rem;
      height: auto;
      border-radius: 0.875rem;
      border-color: rgb(226 232 240);
      background: rgb(255 255 255);
      padding: 0.8rem 0.9rem;
      font-size: 0.95rem;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
    }

    .mobile-form-viewport .cell-control:focus {
      box-shadow:
        0 0 0 3px rgb(59 130 246 / 0.14),
        0 1px 2px rgb(15 23 42 / 0.04);
    }

    .mobile-form-viewport textarea.cell-control {
      min-height: 5.25rem;
      line-height: 1.5;
      resize: vertical;
      overflow: auto;
    }

    .mobile-form-viewport select.cell-control {
      -webkit-appearance: none;
      appearance: none;
      background-color: rgb(255 255 255);
      background-image:
        linear-gradient(45deg, transparent 50%, rgb(100 116 139) 50%),
        linear-gradient(135deg, rgb(100 116 139) 50%, transparent 50%);
      background-position:
        calc(100% - 1rem) center,
        calc(100% - 0.7rem) center;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 2.5rem;
    }

    .mobile-form-viewport .cell-control[type="range"] {
      min-height: 0;
      height: auto;
      padding: 0;
      box-shadow: none;
      border-color: transparent;
    }

    .mobile-form-viewport .cell-control[type="color"] {
      min-height: 3.25rem;
      padding: 0;
      border-color: transparent;
      box-shadow: none;
      background: transparent;
    }

    .mobile-field-row-checkbox {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 0.95rem;
      border: 1px solid rgb(226 232 240);
      border-radius: 0.875rem;
      background: rgb(255 255 255);
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.04);
    }

    .mobile-field-row-checkbox .mobile-field-label {
      margin: 0;
    }

    .mobile-checkbox-control {
      width: 1.35rem;
      height: 1.35rem;
      margin: 0;
      accent-color: rgb(37 99 235);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="flex w-full flex-col">
    <header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur">
      <div>
        <h1 class="text-lg font-semibold tracking-wide">TableEdit</h1>
        <p class="text-xs text-slate-500">Bảng toàn màn hình, chỉnh sửa trực tiếp, phóng to thu nhỏ như Excel</p>
      </div>

      <div class="flex flex-wrap items-center justify-end gap-3">
        <div class="viewport-panel">
          <label for="viewportWidthRange">Rộng khung</label>
          <input id="viewportWidthRange" type="range" min="60" max="100" step="5" value="100" class="w-36 accent-blue-500" />
          <span id="viewportWidthLabel" class="min-w-12 text-right text-sm font-medium text-slate-700">100%</span>
        </div>

        <div class="viewport-panel">
          <label for="rowLimitSelect">Số dòng hiển thị</label>
          <select id="rowLimitSelect" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 outline-none">
            <option value="5" selected>5 dòng</option>
            <option value="15">15 dòng</option>
            <option value="25">25 dòng</option>
            <option value="50">50 dòng</option>
            <option value="100">100 dòng</option>
          </select>
        </div>

        <div class="zoom-panel flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-3 py-2 shadow-sm">
          <button id="zoomOut" class="rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 transition hover:bg-slate-100">-</button>
          <div class="min-w-20 text-center text-sm font-medium text-slate-700"><span id="zoomLabel">100%</span></div>
          <button id="zoomIn" class="rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 transition hover:bg-slate-100">+</button>
          <input id="zoomRange" type="range" min="50" max="200" value="100" class="w-36 accent-blue-500" />
        </div>
      </div>
    </header>

    <main class="relative">
      <div class="relative flex w-full min-w-0 flex-col p-4">
        <div class="mb-3 flex items-center justify-between text-xs text-slate-500">
          <span>Nhấn trực tiếp vào ô để sửa nội dung</span>
          <span>Ctrl + cuộn chuột để đổi zoom</span>
        </div>

        <div id="sheetViewport" class="sheet-scroll relative min-w-0 overflow-auto border bg-white shadow-xl shadow-slate-200/60">
          <div id="sheetStage" class="relative min-w-0">
            <div id="sheetWrap" class="sheet-zoom">
              <table class="w-max table-fixed border-separate border-spacing-0 text-sm">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="mobileFormViewport" class="mobile-form-viewport flex-1 overflow-auto"></div>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_ZOOM = 100;
    const MIN_ZOOM = 50;
    const MAX_ZOOM = 200;
    // Nút +/- chỉ nhích nhẹ, còn cuộn chuột dùng bước lớn hơn để zoom nhanh
    const STEP_ZOOM_BUTTON = 1;
    const STEP_ZOOM_WHEEL = 10;
    const DEFAULT_COL_WIDTH = 144;
    const DEFAULT_ROW_HEIGHT = 48;
    const MIN_COL_WIDTH = 80;
    const MIN_ROW_HEIGHT = 32;

    // Template header được khai báo theo nhóm để nhìn vào là biết cột nào thuộc nhóm nào
    const HEADER_TEMPLATE = [
      {
        groupLabel: 'Thông tin cơ bản',
        columns: [
          { 
            headerLabel: 'Chữ', 
            type: 'text', 
            defaultValue: '',
            placeholder: "Nhập chữ",
            controlAttributes: [
              {name: "disabled"},
            ],
          },
          { headerLabel: 'Nhiều dòng', type: 'textarea', defaultValue: '' },
          { headerLabel: 'Số', type: 'number', defaultValue: '' },
        ],
      },
      {
        groupLabel: 'Thời gian',
        columns: [
          { headerLabel: 'Ngày', type: 'date', defaultValue: '' },
          { headerLabel: 'Giờ', type: 'time', defaultValue: '' },
          { headerLabel: 'Ngày giờ', type: 'datetime-local', defaultValue: '' },
        ],
      },
      {
        groupLabel: 'Liên hệ',
        columns: [
          { headerLabel: 'Email', type: 'email', defaultValue: '' },
          { headerLabel: 'Điện thoại', type: 'tel', defaultValue: '' },
          { headerLabel: 'Website', type: 'url', defaultValue: '' },
        ],
      },
      {
        groupLabel: 'Hiển thị',
        columns: [
          { headerLabel: 'Màu sắc', type: 'color', defaultValue: '#ffffff' },
          { headerLabel: 'Range', type: 'range', defaultValue: '50', min: '0', max: '100' },
        ],
      },
      {
        groupLabel: 'Trạng thái',
        columns: [
          { headerLabel: 'Checkbox', type: 'checkbox', defaultValue: false },
          {
            headerLabel: 'Checkbox list',
            type: 'checkbox-list',
            defaultValue: [],
            options: [
              { value: 'A', label: 'A' },
              { value: 'B', label: 'B' },
              { value: 'C', label: 'C' },
            ],
          },
          {
            headerLabel: 'Select',
            type: 'select',
            defaultValue: '',
            options: [
              { value: '', label: 'Chọn' },
              { value: 'A', label: 'A' },
              { value: 'B', label: 'B' },
              { value: 'C', label: 'C' },
            ],
          },
        ],
      },
      {
        groupLabel: 'Bảo mật',
        columns: [
          { headerLabel: 'Password', type: 'password', defaultValue: '' },
          {
            headerLabel: 'Radio list',
            type: 'radio-list',
            defaultValue: '',
            options: [
              { value: 'A', label: 'Thấp' },
              { value: 'B', label: 'Trung bình' },
              { value: 'C', label: 'Cao' },
            ],
          },
        ],
      },
      {
        groupLabel: 'Thời gian',
        columns: [
          { headerLabel: 'Month', type: 'month', defaultValue: '' },
          { headerLabel: 'Week', type: 'week', defaultValue: '' },
        ],
      },
      {
        groupLabel: 'Tìm kiếm',
        columns: [
          { headerLabel: 'Search', type: 'search', defaultValue: '' },
        ],
      },
      {
        groupLabel: 'Khác',
        columns: [
          { headerLabel: 'Văn bản', type: 'text', defaultValue: '' },
          { headerLabel: 'Số 2', type: 'number', defaultValue: '' },
          { headerLabel: 'Textarea 2', type: 'textarea', defaultValue: '' },
          { headerLabel: 'Date 2', type: 'date', defaultValue: '' },
          { headerLabel: 'Time 2', type: 'time', defaultValue: '' },
          {
            headerLabel: 'Select 2',
            type: 'select',
            defaultValue: '',
            options: [
              { value: '', label: 'Chọn' },
              { value: 'A', label: 'A' },
              { value: 'B', label: 'B' },
              { value: 'C', label: 'C' },
            ],
          },
          { headerLabel: 'Checkbox 2', type: 'checkbox', defaultValue: false },
          { headerLabel: 'URL 2', type: 'url', defaultValue: '' },
          { headerLabel: 'Cuối dòng', type: 'text', defaultValue: '' },
        ],
      },
    ];

    // Bảng phẳng để render, nhưng cấu trúc gốc vẫn nằm theo nhóm để người dùng đọc dễ
    const COLUMN_SCHEMA = HEADER_TEMPLATE.flatMap((group) =>
      group.columns.map((column) => ({
        ...column,
        groupLabel: group.groupLabel,
      })),
    );

    /*
    Ví dụ custom cho từng ô nhập:
    {
      headerLabel: 'Mã khách hàng',
      type: 'text',
      defaultValue: '',
      placeholder: 'Nhập mã khách hàng',
      controlId: 'customer-code',
      controlClassName: 'bg-yellow-50',
      controlAttributes: [
        { name: 'required' },
        { name: 'data-field', value: 'customer_code' },
        { name: 'autocomplete', value: 'off' },
      ],
    }

    Ví dụ ô checkbox/radio dạng list:
    {
      headerLabel: 'Tùy chọn',
      type: 'checkbox-list',
      defaultValue: [],
      options: [
        { value: 'A', label: 'A' },
        { value: 'B', label: 'B' },
        { value: 'C', label: 'C' },
      ],
    }

    {
      headerLabel: 'Mức ưu tiên',
      type: 'radio-list',
      defaultValue: '',
      options: [
        { value: 'A', label: 'Thấp' },
        { value: 'B', label: 'Trung bình' },
        { value: 'C', label: 'Cao' },
      ],
    }
    */

    // Số cột của bảng luôn bám theo template schema
    const COLS = COLUMN_SCHEMA.length;

    // Cấu hình cho các cột cố định như STT và action
    const FIXED_COLUMN_TEMPLATE = {
      rowNumber: {
        enabled: true,
        headerLabel: 'STT',
        width: 64,
        minWidth: 48,
        autoFit: true,
        className: '',
        cellClassName: '',
        stickyClassName: 'sticky left-0',
        valueFormatter: (rowIndex) => String(rowIndex + 1),
      },
      action: {
        enabled: true,
        headerLabel: 'Action',
        width: 120,
        minWidth: 120,
        autoFit: true,
        className: '',
        cellClassName: '',
        stickyClassName: 'sticky right-0',
        buttons: [
          {
            label: 'Sửa',
            action: 'edit',
            className: 'border-blue-200 bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700',
          },
          {
            label: 'Xóa',
            action: 'delete',
            className: 'border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100 hover:text-rose-700',
          },
        ],
      },
    };

    const sheetViewport = document.getElementById('sheetViewport');
    const mobileFormViewport = document.getElementById('mobileFormViewport');
    const sheetWrap = document.getElementById('sheetWrap');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const viewportWidthRange = document.getElementById('viewportWidthRange');
    const viewportWidthLabel = document.getElementById('viewportWidthLabel');
    const rowLimitSelect = document.getElementById('rowLimitSelect');
    const zoomLabel = document.getElementById('zoomLabel');
    const zoomRange = document.getElementById('zoomRange');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');

    let zoom = DEFAULT_ZOOM;
    let viewportWidthPercent = Number(viewportWidthRange?.value || 100);
    let visibleRowLimit = Number(rowLimitSelect?.value || 5);
    const colWidths = Array.from({ length: COLS }, () => DEFAULT_COL_WIDTH);
    const rowHeights = [];
    const mobileZoomQuery = window.matchMedia('(max-width: 768px)');

    // Trạng thái responsive để mobile luôn giữ 100% và không bị ảnh hưởng bởi zoom
    function isMobileLayout() {
      // Ưu tiên màn hình nhỏ và thiết bị chạm để chuyển sang form mobile
      return mobileZoomQuery.matches || window.matchMedia('(pointer: coarse)').matches;
    }

    function setZoom(nextZoom) {
      if (isMobileLayout()) {
        zoom = DEFAULT_ZOOM;
        sheetWrap.style.zoom = '1';
        zoomLabel.textContent = `${DEFAULT_ZOOM}%`;
        zoomRange.value = String(DEFAULT_ZOOM);
        updateViewportSizing();
        return;
      }

      zoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      sheetWrap.style.zoom = String(zoom / 100);
      zoomLabel.textContent = `${zoom}%`;
      zoomRange.value = String(zoom);
      updateViewportSizing();
    }

    // Đồng bộ width khung bảng và số dòng hiển thị
    function updateViewportSizing() {
      if (!sheetViewport) return;

      const widthPercent = Math.min(100, Math.max(60, viewportWidthPercent));
      const zoomFactor = zoom / 100;
      const hasGroupHeader = COLUMN_SCHEMA.some((schema) => Boolean(schema.groupLabel));
      const headerHeight = hasGroupHeader ? 80 : 40;
      const isLocked = rowHeights.length >= Math.max(1, visibleRowLimit);
      const lockedRowsHeight = rowHeights
        .slice(0, Math.max(1, visibleRowLimit))
        .reduce((sum, height) => sum + height, 0);
      const maxHeight = Math.round((headerHeight + lockedRowsHeight) * zoomFactor + 4);

      sheetViewport.style.setProperty('--sheet-viewport-width', `${widthPercent}%`);
      sheetViewport.style.setProperty('--sheet-viewport-max-height', isLocked ? `${maxHeight}px` : 'none');
      sheetViewport.style.flex = '0 0 auto';

      if (viewportWidthLabel) {
        viewportWidthLabel.textContent = `${widthPercent}%`;
      }
    }

    // Đồng bộ nút zoom theo kích thước màn hình
    function syncResponsiveZoomState() {
      const mobile = isMobileLayout();
      document.body.classList.toggle('is-mobile-layout', mobile);

      zoomRange.disabled = mobile;
      zoomInBtn.disabled = mobile;
      zoomOutBtn.disabled = mobile;

      if (mobile) {
        setZoom(DEFAULT_ZOOM);
        updateViewportSizing();
        renderMobileForm();
        return;
      }

      if (mobileFormViewport) {
        mobileFormViewport.replaceChildren();
      }

      setZoom(zoom);
      updateViewportSizing();
    }

    function applyColumnWidth(colIndex, width) {
      const nextWidth = Math.max(MIN_COL_WIDTH, width);
      colWidths[colIndex] = nextWidth;

      document.querySelectorAll(`[data-col="${colIndex}"]`).forEach((el) => {
        el.style.width = `${nextWidth}px`;
        el.style.minWidth = `${nextWidth}px`;
        el.style.maxWidth = `${nextWidth}px`;
      });
    }

    // Áp dụng độ rộng cho các cột cố định như STT và action
    function applyFixedColumnWidth(columnKey, width) {
      const config = FIXED_COLUMN_TEMPLATE[columnKey];
      const nextWidth = Math.max(config?.minWidth || 48, width);
      if (!config) return;

      config.width = nextWidth;

      document.querySelectorAll(`[data-fixed-column="${columnKey}"]`).forEach((el) => {
        el.style.width = `${nextWidth}px`;
        el.style.minWidth = `${nextWidth}px`;
        el.style.maxWidth = `${nextWidth}px`;
      });
    }

    // Tính độ rộng phù hợp cho cột cố định, action sẽ tự nở theo số nút
    function getFixedColumnWidth(columnKey) {
      const config = FIXED_COLUMN_TEMPLATE[columnKey];
      if (!config) return 0;

      if (columnKey === 'rowNumber' && config.autoFit !== false) {
        const digits = String(Math.max(1, rowHeights.length || 1)).length;
        return Math.max(config.minWidth || config.width || 48, digits * 8 + 24);
      }

      if (columnKey === 'action' && config.autoFit !== false) {
        const buttons = config.buttons || [];
        const buttonWidths = buttons.reduce((total, button) => {
          const labelLength = String(button.label || 'Action').length;
          return total + Math.max(44, labelLength * 8 + 22);
        }, 0);
        const gapWidth = Math.max(0, buttons.length - 1) * 4;
        return Math.max(config.minWidth || config.width || 120, buttonWidths + gapWidth + 16);
      }

      return config.width || config.minWidth || 64;
    }

    function applyRowHeight(rowIndex, height) {
      const nextHeight = Math.max(MIN_ROW_HEIGHT, height);
      rowHeights[rowIndex] = nextHeight;

      const row = tableBody.querySelector(`tr[data-row="${rowIndex}"]`);
      if (!row) return;

      // Chỉ áp chiều cao cho hàng và các ô trong hàng, không chạm vào nút action bên trong
      row.style.height = `${nextHeight}px`;
      row.style.minHeight = `${nextHeight}px`;
      row.style.maxHeight = `${nextHeight}px`;

      Array.from(row.children).forEach((cell) => {
        if (!(cell instanceof HTMLElement)) return;
        cell.style.height = `${nextHeight}px`;
        cell.style.minHeight = `${nextHeight}px`;
        cell.style.maxHeight = `${nextHeight}px`;
      });

      updateViewportSizing();
    }

    function rowHasContent(rowIndex) {
      const row = tableBody.querySelector(`tr[data-row="${rowIndex}"]`);
      if (!row) return false;

      return Array.from(row.querySelectorAll('[data-cell-control]')).some((control) => {
        const currentValue = getControlSerializedValue(control);
        const initialValue = control.dataset.initialValue ?? '';

        if (control.type === 'checkbox' || control.type === 'radio') {
          return control.checked !== (control.dataset.initialValue === '1');
        }

        if (control.tagName === 'SELECT') {
          return control.value !== control.dataset.initialValue;
        }

        if (control.tagName === 'TEXTAREA') {
          return control.value !== control.dataset.initialValue;
        }

        return String(control.value ?? '') !== String(control.dataset.initialValue ?? '');
      });
    }

    // Chuẩn hóa giá trị của control để so sánh khi row có thay đổi hay không
    function getControlSerializedValue(control) {
      if (!control) return '';

      if (control.dataset && control.dataset.controlValue != null) {
        return control.dataset.controlValue;
      }

      if (control.type === 'checkbox' || control.type === 'radio') {
        return control.checked ? '1' : '0';
      }

      if (control.tagName === 'SELECT' || control.tagName === 'TEXTAREA' || 'value' in control) {
        return String(control.value ?? '');
      }

      return '';
    }

    // Lấy giá trị hiện tại của control theo kiểu dữ liệu để đưa sang form mobile
    function getControlValue(control, schema) {
      if (!control) return schema.type === 'checkbox-list' ? [] : '';

      if (schema.type === 'checkbox-list') {
        const rawValue = control.dataset.controlValue || control.dataset.initialValue || '[]';
        try {
          return JSON.parse(rawValue);
        } catch (error) {
          return [];
        }
      }

      if (schema.type === 'radio-list') {
        return control.dataset.controlValue || control.dataset.initialValue || '';
      }

      if (schema.type === 'checkbox') {
        const checkbox = control.matches('input[type="checkbox"]')
          ? control
          : control.querySelector('input[type="checkbox"]');
        return Boolean(checkbox?.checked);
      }

      if (schema.type === 'select' || schema.type === 'textarea' || 'value' in control) {
        return control.value ?? '';
      }

      return '';
    }

    // Ghi giá trị từ form mobile ngược lại control trong bảng
    function setControlValue(control, schema, value) {
      if (!control) return;

      if (schema.type === 'checkbox-list') {
        const selectedValues = new Set(Array.isArray(value) ? value.map(String) : []);
        control.querySelectorAll('input[type="checkbox"][data-option-value]').forEach((input) => {
          input.checked = selectedValues.has(input.dataset.optionValue || '');
        });

        control.dataset.controlValue = JSON.stringify(Array.from(selectedValues));
        return;
      }

      if (schema.type === 'radio-list') {
        const nextValue = String(value ?? '');
        control.querySelectorAll('input[type="radio"][data-option-value]').forEach((input) => {
          input.checked = (input.dataset.optionValue || '') === nextValue;
        });

        control.dataset.controlValue = nextValue;
        return;
      }

      if (schema.type === 'checkbox') {
        const checkbox = control.matches('input[type="checkbox"]')
          ? control
          : control.querySelector('input[type="checkbox"]');
        if (checkbox) {
          checkbox.checked = Boolean(value);
        }
        return;
      }

      if ('value' in control) {
        control.value = value ?? '';
      }
    }

    // Tìm control tương ứng trong bảng theo dòng và cột
    function getTableCellControl(rowIndex, colIndex) {
      const cell = tableBody.querySelector(`tr[data-row="${rowIndex}"] td[data-col="${colIndex}"]`);
      if (!cell) return null;

      return cell.querySelector('[data-cell-control]');
    }

    // Tạo view form riêng cho điện thoại theo kiểu mỗi ô nhập là một field độc lập
    function renderMobileForm() {
      if (!mobileFormViewport) return;

      mobileFormViewport.replaceChildren();

      if (!isMobileLayout()) return;

      const form = document.createElement('div');
      form.className = 'mobile-form-section';

      const rowElements = Array.from(tableBody.querySelectorAll('tr[data-row]'));

      rowElements.forEach((rowEl, rowIndex) => {
        const logicalRowIndex = Number(rowEl.dataset.row);
        if (Number.isNaN(logicalRowIndex)) return;

        const rowCard = document.createElement('section');
        rowCard.className = 'mobile-row-card';

        const rowHeader = document.createElement('div');
        rowHeader.className = 'mobile-row-header';

        const rowTitle = document.createElement('div');
        rowTitle.className = 'mobile-row-title';
        rowTitle.textContent = `Dòng ${logicalRowIndex + 1}`;
        rowHeader.appendChild(rowTitle);

        const mobileActions = createMobileActionButtons(logicalRowIndex);
        if (mobileActions) {
          rowHeader.appendChild(mobileActions);
        }

        rowCard.appendChild(rowHeader);

        let flatColIndex = 0;

        HEADER_TEMPLATE.forEach((group) => {
          const groupBox = document.createElement(group.groupLabel ? 'fieldset' : 'div');
          groupBox.className = 'mobile-fieldset';

          if (group.groupLabel) {
            const legend = document.createElement('legend');
            legend.textContent = group.groupLabel;
            groupBox.appendChild(legend);
          }

          group.columns.forEach((column) => {
            const colIndex = flatColIndex;
            flatColIndex += 1;
            if (colIndex < 0) return;

            const fieldRow = document.createElement('div');
            fieldRow.className = 'mobile-field-row';
            if (column.type === 'checkbox') {
              fieldRow.classList.add('mobile-field-row-checkbox');
            }

            const label = document.createElement('label');
            label.className = 'mobile-field-label';
            label.textContent = column.headerLabel || '';
            label.htmlFor = `mobile-${logicalRowIndex}-${colIndex}`;

            const tableControl = getTableCellControl(logicalRowIndex, colIndex);
            const currentValue = getControlValue(tableControl, column);
            let mobileControl = null;

            if (column.type === 'checkbox') {
              mobileControl = document.createElement('input');
              mobileControl.type = 'checkbox';
              mobileControl.className = 'mobile-checkbox-control';
              mobileControl.id = `mobile-${logicalRowIndex}-${colIndex}`;
              mobileControl.checked = Boolean(currentValue);
              mobileControl.setAttribute('aria-label', column.headerLabel || '');
            } else {
              mobileControl = createControl(column, currentValue, logicalRowIndex);

              if (mobileControl && mobileControl.id) {
                mobileControl.id = `mobile-${logicalRowIndex}-${colIndex}`;
              } else if (mobileControl) {
                mobileControl.id = `mobile-${logicalRowIndex}-${colIndex}`;
              }
            }

            const syncToTable = () => {
              const beforeRowCount = tableBody.querySelectorAll('tr[data-row]').length;
              const nextValue = column.type === 'checkbox'
                ? Boolean(mobileControl.checked)
                : getControlValue(mobileControl, column);
              setControlValue(tableControl, column, nextValue);

              if (tableControl) {
                tableControl.dispatchEvent(new Event('input', { bubbles: true }));
                tableControl.dispatchEvent(new Event('change', { bubbles: true }));
              }

              const afterRowCount = tableBody.querySelectorAll('tr[data-row]').length;
              if (afterRowCount !== beforeRowCount && isMobileLayout()) {
                renderMobileForm();
              }
            };

            mobileControl.addEventListener('input', syncToTable);
            mobileControl.addEventListener('change', syncToTable);

            fieldRow.appendChild(label);
            fieldRow.appendChild(mobileControl);
            groupBox.appendChild(fieldRow);
          });

          rowCard.appendChild(groupBox);
        });

        form.appendChild(rowCard);
      });

      mobileFormViewport.appendChild(form);
    }

    // Tự nới chiều cao của hàng nếu danh sách checkbox/radio cần nhiều chỗ hơn
    function autoFitListRow(wrapper) {
      if (!wrapper) return;

      const row = wrapper.closest('tr');
      if (!row) return;

      const rowIndex = Number(row.dataset.row);
      if (Number.isNaN(rowIndex)) return;

      const rowLabelCell = row.querySelector('[data-fixed-column="rowNumber"]');
      const actionCell = row.querySelector('[data-fixed-column="action"]');
      const rowCell = wrapper.closest('td');
      if (!rowCell) return;

      const currentHeight = rowHeights[rowIndex] || MIN_ROW_HEIGHT;
      const contentHeight = wrapper.scrollHeight + 12;
      const nextHeight = Math.max(currentHeight, contentHeight);

      if (nextHeight !== currentHeight) {
        applyRowHeight(rowIndex, nextHeight);

        if (rowLabelCell) {
          rowLabelCell.style.height = `${nextHeight}px`;
        }

        if (actionCell) {
          actionCell.style.height = `${nextHeight}px`;
        }
      }
    }

    // Tạo danh sách checkbox/radio trong một ô
    function createListControl(schema, value, rowIndex) {
      const wrapper = document.createElement('div');
      const isCheckboxList = schema.type === 'checkbox-list';
      const isRadioList = schema.type === 'radio-list';
      const options = schema.options || [];
      const controlName = schema.controlId
        ? `${schema.controlId}-${rowIndex ?? 'row'}`
        : `${schema.type}-${rowIndex ?? 'row'}-${Math.random().toString(36).slice(2)}`;

      wrapper.className = 'cell-control cell-control-list';
      wrapper.dataset.cellControl = 'true';
      wrapper.dataset.initialValue = '';
      if (rowIndex != null) {
        wrapper.dataset.rowIndex = String(rowIndex);
      }

      if (schema.controlId) {
        wrapper.id = schema.controlId;
      }

      if (schema.controlClassName) {
        wrapper.className = `${wrapper.className} ${schema.controlClassName}`.trim();
      }

      const selectedValues = isCheckboxList
        ? new Set(Array.isArray(value) ? value.map(String) : [])
        : new Set([String(value ?? '')]);

      const syncValue = () => {
        const nextValue = isCheckboxList
          ? Array.from(wrapper.querySelectorAll('input[type="checkbox"][data-option-value]'))
              .filter((input) => input.checked)
              .map((input) => input.dataset.optionValue || '')
          : (wrapper.querySelector('input[type="radio"]:checked')?.dataset.optionValue || '');

        const serialized = isCheckboxList ? JSON.stringify(nextValue) : String(nextValue || '');
        wrapper.dataset.controlValue = serialized;
      };

      options.forEach((option, index) => {
        const item = document.createElement('label');
        item.className = 'cell-control-list-item';

        const input = document.createElement('input');
        input.type = isCheckboxList ? 'checkbox' : 'radio';
        input.name = isRadioList ? controlName : `${controlName}-${index}`;
        input.value = option.value ?? '';
        input.dataset.optionValue = String(option.value ?? '');
        input.dataset.initialValue = selectedValues.has(String(option.value ?? '')) ? '1' : '0';
        input.checked = selectedValues.has(String(option.value ?? ''));
        input.className = isCheckboxList ? 'h-4 w-4 accent-blue-600' : 'h-4 w-4 accent-blue-600';

        input.addEventListener('change', () => {
          if (isRadioList && input.checked) {
            wrapper.querySelectorAll('input[type="radio"][data-option-value]').forEach((other) => {
              if (other !== input) {
                other.checked = false;
              }
            });
          }

          syncValue();
        });

        const span = document.createElement('span');
        span.textContent = option.label ?? option.value ?? '';

        item.appendChild(input);
        item.appendChild(span);
        wrapper.appendChild(item);
      });

      syncValue();
      wrapper.dataset.initialValue = wrapper.dataset.controlValue || '';
      applyControlCustomization(wrapper, schema);
      bindHorizontalCenterOnFocus(wrapper);
      requestAnimationFrame(() => autoFitListRow(wrapper));
      return wrapper;
    }

    // Gom các cột liên tiếp có cùng groupLabel để dựng group header
    function buildHeaderGroups(schemaList) {
      const groups = [];
      let index = 0;

      while (index < schemaList.length) {
        const label = schemaList[index]?.groupLabel || '';
        let span = 1;

        while (
          index + span < schemaList.length &&
          (schemaList[index + span]?.groupLabel || '') === label
        ) {
          span += 1;
        }

        groups.push({ label, span });
        index += span;
      }

      return groups;
    }

    // Áp dụng class, id và attribute tùy biến cho từng control theo schema
    function applyControlCustomization(element, schema, extraClassName = '') {
      if (schema.controlId) {
        element.id = schema.controlId;
      }

      const classes = [schema.controlClassName, extraClassName].filter(Boolean).join(' ');
      if (classes) {
        element.className = `${element.className} ${classes}`.trim();
      }

      const attributes = schema.controlAttributes || [];
      const normalizedAttributes = Array.isArray(attributes)
        ? attributes
        : Object.entries(attributes).map(([name, value]) => ({ name, value }));

      normalizedAttributes.forEach((attribute) => {
        if (!attribute) return;

        if (typeof attribute === 'string') {
          element.setAttribute(attribute, '');
          return;
        }

        const name = attribute.name || attribute.key;
        if (!name) return;

        const value = attribute.value;
        if (value == null) {
          element.setAttribute(name, '');
          return;
        }

        element.setAttribute(name, String(value));
      });
    }

    // Gán placeholder theo schema cho những control nhập chữ
    function applyControlPlaceholder(element, schema) {
      if (!element || schema.placeholder == null) return;

      if (element.tagName === 'SELECT') return;
      if (schema.type === 'checkbox' || schema.type === 'checkbox-list' || schema.type === 'radio-list') {
        return;
      }

      element.setAttribute('placeholder', String(schema.placeholder));
    }

    // Khi control được focus hoặc click xong, kéo ngang ô đó về giữa khung bảng
    function centerFocusedCellHorizontally(control, smooth = true) {
      if (!sheetViewport || !control || isMobileLayout()) return;

      const cell = control.closest('td[data-col]');
      if (!cell) return;

      const viewportRect = sheetViewport.getBoundingClientRect();
      const cellRect = cell.getBoundingClientRect();
      const viewportCenterX = viewportRect.left + viewportRect.width / 2;
      const cellCenterX = cellRect.left + cellRect.width / 2;
      const deltaX = cellCenterX - viewportCenterX;

      // Nếu ô đã gần giữa rồi thì bỏ qua để tránh giật nhẹ
      if (Math.abs(deltaX) < 8) return;

      const maxScrollLeft = Math.max(0, sheetViewport.scrollWidth - sheetViewport.clientWidth);
      const nextScrollLeft = Math.min(maxScrollLeft, Math.max(0, sheetViewport.scrollLeft + deltaX));
      // Cuộn mượt khi đi bằng bàn phím, còn nhấn chuột thì canh ngay lập tức để click không bị lỡ
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (smooth && typeof sheetViewport.scrollTo === 'function' && !prefersReducedMotion) {
        sheetViewport.scrollTo({ left: nextScrollLeft, behavior: 'smooth' });
        return;
      }

      sheetViewport.scrollLeft = nextScrollLeft;
    }

    // Nhận diện các control có nút mở picker ở mép phải như date/time
    function isPickerInput(control) {
      if (!control || control.tagName !== 'INPUT') return false;
      return ['date', 'time', 'datetime-local', 'month', 'week'].includes(control.type);
    }

    // Gắn sự kiện focus và click để tự canh ô đang nhập vào giữa bảng theo chiều ngang
    function bindHorizontalCenterOnFocus(control) {
      if (!control) return;

      control.addEventListener('pointerdown', (event) => {
        // Đánh dấu đây là nhấn chuột để focusin không canh giữa trước khi click chạy
        if (event.button != null && event.button !== 0) return;

        // Nếu là ô có picker hệ thống và người dùng bấm vào vùng nút lịch ở mép phải
        // thì bỏ qua canh giữa để không làm lỡ thao tác mở lịch
        if (isPickerInput(control)) {
          const controlRect = control.getBoundingClientRect();
          const pickerAreaWidth = 36;
          if (event.clientX >= controlRect.right - pickerAreaWidth) {
            control.dataset.skipPointerCenter = '1';
            return;
          }
        }

        control.dataset.pointerCenterTimestamp = String(Date.now());
      }, true);

      control.addEventListener('click', () => {
        if (control.dataset.skipPointerCenter === '1') {
          delete control.dataset.skipPointerCenter;
          delete control.dataset.pointerCenterTimestamp;
          return;
        }

        const pointerCenterTimestamp = Number(control.dataset.pointerCenterTimestamp || 0);
        if (!pointerCenterTimestamp || Date.now() - pointerCenterTimestamp > 1000) return;

        delete control.dataset.pointerCenterTimestamp;
        requestAnimationFrame(() => centerFocusedCellHorizontally(control));
      });

      control.addEventListener('focusin', () => {
        if (control.dataset.skipPointerCenter === '1') return;

        const pointerCenterTimestamp = Number(control.dataset.pointerCenterTimestamp || 0);
        if (pointerCenterTimestamp && Date.now() - pointerCenterTimestamp < 1000) return;

        requestAnimationFrame(() => centerFocusedCellHorizontally(control));
      });

      control.addEventListener('blur', () => {
        delete control.dataset.pointerCenterTimestamp;
        delete control.dataset.skipPointerCenter;
      });
    }

    // Tạo ô cố định phía trái cho cột STT
    function createRowNumberCell(rowIndex, rowHeight) {
      const cell = document.createElement('td');
      const config = FIXED_COLUMN_TEMPLATE.rowNumber;
      const width = getFixedColumnWidth('rowNumber');
      cell.dataset.fixedColumn = 'rowNumber';
      cell.dataset.rowLabel = 'true';
      cell.textContent = config.valueFormatter ? config.valueFormatter(rowIndex) : String(rowIndex + 1);
      cell.className = [
        'sheet-row-header relative z-20 border-b border-r px-3 text-left text-xs font-semibold overflow-hidden',
        config.stickyClassName,
        config.className,
        config.cellClassName,
      ].filter(Boolean).join(' ');
      cell.style.width = `${width}px`;
      cell.style.minWidth = `${width}px`;
      cell.style.maxWidth = `${width}px`;
      cell.style.height = `${rowHeight}px`;
      return cell;
    }

    // Tạo ô action cố định phía phải cho từng dòng
    function createActionCell(rowIndex, rowHeight) {
      const cell = document.createElement('td');
      const config = FIXED_COLUMN_TEMPLATE.action;
      const width = getFixedColumnWidth('action');
      cell.dataset.fixedColumn = 'action';
      cell.className = [
        'sheet-action-cell relative z-20 border-b border-l border-r px-2 text-xs overflow-hidden align-middle',
        config.stickyClassName,
        config.className,
        config.cellClassName,
      ].filter(Boolean).join(' ');
      cell.style.width = `${width}px`;
      cell.style.minWidth = `${width}px`;
      cell.style.maxWidth = `${width}px`;
      cell.style.height = `${rowHeight}px`;

      const wrapper = document.createElement('div');
      wrapper.className = 'flex h-full w-full items-center justify-center gap-1 px-1 py-0.5';

      (config.buttons || []).forEach((buttonDef) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = buttonDef.label || 'Action';
        button.dataset.row = String(rowIndex);
        button.dataset.action = buttonDef.action || buttonDef.label || 'action';
        button.className = [
          'sheet-action-button',
          buttonDef.className || 'text-slate-700 hover:bg-slate-100',
        ].join(' ');
        wrapper.appendChild(button);
      });

      cell.appendChild(wrapper);
      return cell;
    }

    // Xóa một dòng dữ liệu, nhưng luôn chừa lại dòng trống đặc biệt ở cuối bảng
    function deleteRow(rowIndex) {
      if (rowIndex < 0 || rowIndex >= rowHeights.length) return;

      // Dòng cuối luôn là dòng trống đặc biệt, không được phép xóa
      if (rowIndex === rowHeights.length - 1) return;

      const row = tableBody.querySelector(`tr[data-row="${rowIndex}"]`);
      if (row) {
        row.remove();
      }

      rowHeights.splice(rowIndex, 1);

      // Cập nhật lại chỉ số và height cho các dòng phía sau để không phải dựng lại toàn bộ bảng
      Array.from(tableBody.querySelectorAll('tr[data-row]'))
        .slice(rowIndex)
        .forEach((rowEl, offset) => {
          const actualIndex = rowIndex + offset;
          rowEl.dataset.row = String(actualIndex);
          rowEl.style.height = `${rowHeights[actualIndex]}px`;

          const rowNumberCell = rowEl.querySelector('[data-fixed-column="rowNumber"]');
          if (rowNumberCell) {
            rowNumberCell.textContent = String(actualIndex + 1);
            rowNumberCell.style.height = `${rowHeights[actualIndex]}px`;
          }

          const actionCell = rowEl.querySelector('[data-fixed-column="action"]');
          if (actionCell) {
            actionCell.style.height = `${rowHeights[actualIndex]}px`;
            actionCell.querySelectorAll('button[data-action]').forEach((button) => {
              button.dataset.row = String(actualIndex);
            });
          }

          rowEl.querySelectorAll('[data-col]').forEach((cell) => {
            cell.style.height = `${rowHeights[actualIndex]}px`;
            cell.dataset.row = String(actualIndex);
          });
        });

      updateViewportSizing();
    }

    // Tạo cụm nút action cho mobile ở cùng hàng với tiêu đề dòng
    function createMobileActionButtons(rowIndex) {
      const config = FIXED_COLUMN_TEMPLATE.action;
      if (!config || !config.enabled || !Array.isArray(config.buttons) || !config.buttons.length) {
        return null;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'mobile-row-actions';

      config.buttons.forEach((buttonDef) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = buttonDef.label || 'Action';
        button.dataset.row = String(rowIndex);
        button.dataset.action = buttonDef.action || buttonDef.label || 'action';
        button.className = [
          'mobile-row-action-button inline-flex items-center justify-center whitespace-nowrap leading-none',
          buttonDef.className || '',
        ].filter(Boolean).join(' ');
        wrapper.appendChild(button);
      });

      return wrapper;
    }

    // Tạo ô cố định trên header cho cột STT hoặc action
    function createFixedHeaderCell(columnKey, rowSpan) {
      const config = FIXED_COLUMN_TEMPLATE[columnKey];
      if (!config || !config.enabled) return null;
      const width = getFixedColumnWidth(columnKey);

      const th = document.createElement('th');
      th.dataset.fixedColumn = columnKey;
      th.textContent = config.headerLabel || '';
      th.rowSpan = rowSpan;
      th.className = [
        `sheet-table-header ${config.stickyClassName || ''} relative top-0 z-30 border-b border-l border-r px-3 text-center text-xs font-semibold overflow-hidden`,
        config.className,
      ].filter(Boolean).join(' ');
      th.style.width = `${width}px`;
      th.style.minWidth = `${width}px`;
      th.style.maxWidth = `${width}px`;
      th.style.height = `${rowSpan === 2 ? '5rem' : '2.5rem'}`;
      return th;
    }

    function createControl(schema, value, rowIndex) {
      if (schema.type === 'checkbox-list' || schema.type === 'radio-list') {
        return createListControl(schema, value, rowIndex);
      }

      if (schema.type === 'textarea') {
        const textarea = document.createElement('textarea');
        textarea.className = 'cell-control';
        textarea.dataset.cellControl = 'true';
        textarea.dataset.initialValue = value ?? '';
        textarea.rows = 2;
        textarea.value = value ?? '';
        applyControlPlaceholder(textarea, schema);
        applyControlCustomization(textarea, schema);
        bindHorizontalCenterOnFocus(textarea);
        textarea.addEventListener('focus', () => {
          textarea.scrollTop = 0;
          textarea.scrollLeft = 0;
        });
        textarea.addEventListener('blur', () => {
          textarea.scrollTop = 0;
          textarea.scrollLeft = 0;
        });
        return textarea;
      }

      if (schema.type === 'select') {
        const select = document.createElement('select');
        select.className = 'cell-control';
        select.dataset.cellControl = 'true';
        select.dataset.initialValue = value ?? '';
        (schema.options || []).forEach((option) => {
          const opt = document.createElement('option');
          opt.value = option.value;
          opt.textContent = option.label;
          select.appendChild(opt);
        });
        select.value = value ?? '';
        applyControlCustomization(select, schema);
        bindHorizontalCenterOnFocus(select);
        return select;
      }

      if (schema.type === 'checkbox') {
        const wrapper = document.createElement('div');
        wrapper.className = 'cell-control flex items-center justify-center';
        wrapper.style.padding = '0';
        if (schema.controlWrapperId) {
          wrapper.id = schema.controlWrapperId;
        }
        if (schema.controlWrapperClassName) {
          wrapper.className = `${wrapper.className} ${schema.controlWrapperClassName}`.trim();
        }

        const wrapperAttributes = schema.controlWrapperAttributes || {};
        Object.entries(wrapperAttributes).forEach(([name, value]) => {
          if (value === false || value == null) return;
          if (value === true) {
            wrapper.setAttribute(name, '');
            return;
          }

          wrapper.setAttribute(name, String(value));
        });

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'h-4 w-4 accent-blue-600';
        checkbox.dataset.cellControl = 'true';
        checkbox.dataset.initialValue = value ? '1' : '0';
        checkbox.checked = Boolean(value);
        applyControlCustomization(checkbox, schema, 'm-0');
        bindHorizontalCenterOnFocus(wrapper);
        wrapper.appendChild(checkbox);
        return wrapper;
      }

      const input = document.createElement('input');
      input.type = schema.type;
      input.className = 'cell-control';
      input.dataset.cellControl = 'true';
      input.dataset.initialValue = value ?? '';
      input.value = value ?? '';
      applyControlPlaceholder(input, schema);

      if (schema.type === 'range') {
        input.className = 'cell-control w-full';
        if (schema.min != null) input.min = schema.min;
        if (schema.max != null) input.max = schema.max;
      }

      if (schema.type === 'color') {
        input.className = 'cell-control w-full';
        input.style.padding = '0';
      }

      applyControlCustomization(input, schema);
      bindHorizontalCenterOnFocus(input);

      input.addEventListener('focus', () => {
        input.scrollTop = 0;
        input.scrollLeft = 0;
      });

      input.addEventListener('blur', () => {
        input.scrollTop = 0;
        input.scrollLeft = 0;
      });

      return input;
    }

    function setupColumnResize(handle, colIndex) {
      let startX = 0;
      let startWidth = 0;

      const onMouseMove = (event) => {
        applyColumnWidth(colIndex, startWidth + (event.clientX - startX));
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startX = event.clientX;
        startWidth = colWidths[colIndex];
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // Resize cho group header bằng cách dàn delta đều lên toàn bộ cột trong nhóm
    function setupGroupResize(handle, startCol, span) {
      let startX = 0;
      let startWidths = [];

      const onMouseMove = (event) => {
        const delta = event.clientX - startX;
        const nextWidths = startWidths.map((width) => width + (delta / span));

        for (let offset = 0; offset < span; offset += 1) {
          applyColumnWidth(startCol + offset, nextWidths[offset]);
        }
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startX = event.clientX;
        startWidths = Array.from({ length: span }, (_, offset) => colWidths[startCol + offset]);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function setupRowResize(handle, rowIndex) {
      let startY = 0;
      let startHeight = 0;

      const onMouseMove = (event) => {
        applyRowHeight(rowIndex, startHeight + (event.clientY - startY));
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      handle.addEventListener('mousedown', (event) => {
        event.preventDefault();
        event.stopPropagation();
        startY = event.clientY;
        startHeight = rowHeights[rowIndex];
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    function scrollSheetViewportToBottom() {
      if (!sheetViewport) return;
      if (isMobileLayout()) return;

      // Đợi layout cập nhật xong rồi mới kéo xuống cuối bảng
      requestAnimationFrame(() => {
        sheetViewport.scrollTop = Math.max(0, sheetViewport.scrollHeight - sheetViewport.clientHeight);
      });
    }

    function appendRow({ autoScrollToBottom = false } = {}) {
      const rowIndex = rowHeights.length;
      const rowHeight = DEFAULT_ROW_HEIGHT;
      rowHeights.push(rowHeight);

      const tr = document.createElement('tr');
      tr.dataset.row = String(rowIndex);
      tr.style.height = `${rowHeight}px`;

      if (FIXED_COLUMN_TEMPLATE.rowNumber.enabled) {
        const rowHead = createRowNumberCell(rowIndex, rowHeight);
        const rowHandle = document.createElement('div');
        rowHandle.className = 'resize-handle-row';
        rowHead.appendChild(rowHandle);
        setupRowResize(rowHandle, rowIndex);
        tr.appendChild(rowHead);
      }

      COLUMN_SCHEMA.forEach((schema, colIndex) => {
        const td = document.createElement('td');
        td.className = 'sheet-cell border-b border-r text-slate-900 overflow-hidden';
        td.dataset.col = String(colIndex);
        td.dataset.row = String(rowIndex);
        td.style.width = `${colWidths[colIndex]}px`;
        td.style.minWidth = `${colWidths[colIndex]}px`;
        td.style.maxWidth = `${colWidths[colIndex]}px`;
        td.style.height = `${rowHeight}px`;

        const control = createControl(schema, schema.defaultValue, rowIndex);
        const onValueChange = () => {
          const currentRowIndex = Number(tr.dataset.row);
          if (Number.isNaN(currentRowIndex)) return;

          if (currentRowIndex === rowHeights.length - 1 && rowHasContent(currentRowIndex)) {
            appendRow({ autoScrollToBottom: true });
          }
        };

        control.addEventListener('input', onValueChange);
        control.addEventListener('change', onValueChange);

        td.appendChild(control);
        tr.appendChild(td);
      });

      if (FIXED_COLUMN_TEMPLATE.action.enabled) {
        tr.appendChild(createActionCell(rowIndex, rowHeight));
      }

      tableBody.appendChild(tr);

      if (FIXED_COLUMN_TEMPLATE.rowNumber.enabled) {
        applyFixedColumnWidth('rowNumber', getFixedColumnWidth('rowNumber'));
      }

      updateViewportSizing();

      // Khi đã chạm ngưỡng số dòng hiển thị thì tự kéo xuống cuối để luôn thấy dòng mới
      if (autoScrollToBottom && rowHeights.length >= Math.max(1, visibleRowLimit)) {
        scrollSheetViewportToBottom();
      }

      return tr;
    }

    function buildTable() {
      const hasGroupHeader = COLUMN_SCHEMA.some((schema) => Boolean(schema.groupLabel));
      const fixedRowNumberWidth = getFixedColumnWidth('rowNumber');
      const fixedActionWidth = getFixedColumnWidth('action');

      tableHead.replaceChildren();
      tableBody.replaceChildren();
      rowHeights.length = 0;

      if (hasGroupHeader) {
        const groupRow = document.createElement('tr');
        const columnRow = document.createElement('tr');
        const rowNumberHeader = createFixedHeaderCell('rowNumber', 2);
        const actionHeader = createFixedHeaderCell('action', 2);

        if (rowNumberHeader) {
          groupRow.appendChild(rowNumberHeader);
        }

        for (let col = 0; col < COLS; col += 1) {
          const schema = COLUMN_SCHEMA[col] || {};
          const groupLabel = schema.groupLabel || '';
          const headerLabel = schema.headerLabel || '';
          const prevGroupLabel = COLUMN_SCHEMA[col - 1]?.groupLabel || '';
          const isGroupStart = Boolean(groupLabel) && groupLabel !== prevGroupLabel;

          if (!groupLabel) {
            const standaloneHeader = document.createElement('th');
            standaloneHeader.dataset.col = String(col);
            standaloneHeader.textContent = headerLabel;
            standaloneHeader.rowSpan = 2;
            standaloneHeader.className = [
              'sheet-table-header relative sticky top-0 z-20 h-20 border-b border-r px-3 text-left text-xs font-semibold',
            ].join(' ');

            standaloneHeader.style.width = `${colWidths[col]}px`;
            standaloneHeader.style.minWidth = `${colWidths[col]}px`;
            standaloneHeader.style.maxWidth = `${colWidths[col]}px`;

            const handle = document.createElement('div');
            handle.className = 'resize-handle-col';
            standaloneHeader.appendChild(handle);
            setupColumnResize(handle, col);

            groupRow.appendChild(standaloneHeader);
            continue;
          }

          if (isGroupStart) {
            let span = 1;
            while (
              col + span < COLS &&
              (COLUMN_SCHEMA[col + span]?.groupLabel || '') === groupLabel
            ) {
              span += 1;
            }

            const groupCell = document.createElement('th');
            groupCell.textContent = groupLabel;
            groupCell.colSpan = span;
            groupCell.className = [
              'sheet-table-group-header relative sticky top-0 z-20 h-10 border-b border-r px-3 text-center text-xs font-semibold',
            ].join(' ');

            if (span > 1) {
              const groupHandle = document.createElement('div');
              groupHandle.className = 'resize-handle-col';
              groupCell.appendChild(groupHandle);
              setupGroupResize(groupHandle, col, span);
            }

            groupRow.appendChild(groupCell);
          }

          const th = document.createElement('th');
          th.dataset.col = String(col);
          th.textContent = headerLabel;
          th.className = [
            'sheet-table-header relative sticky top-10 z-20 h-10 border-b border-r px-3 text-left text-xs font-semibold',
          ].join(' ');

          th.style.width = `${colWidths[col]}px`;
          th.style.minWidth = `${colWidths[col]}px`;
          th.style.maxWidth = `${colWidths[col]}px`;

          const handle = document.createElement('div');
          handle.className = 'resize-handle-col';
          th.appendChild(handle);
          setupColumnResize(handle, col);

          columnRow.appendChild(th);
        }

        if (actionHeader) {
          groupRow.appendChild(actionHeader);
        }

        tableHead.appendChild(groupRow);
        tableHead.appendChild(columnRow);
      } else {
        const headRow = document.createElement('tr');
        const rowNumberHeader = createFixedHeaderCell('rowNumber', 1);
        const actionHeader = createFixedHeaderCell('action', 1);

        if (rowNumberHeader) {
          headRow.appendChild(rowNumberHeader);
        }

        for (let col = 0; col < COLS; col += 1) {
          const schema = COLUMN_SCHEMA[col] || {};
          const th = document.createElement('th');
          th.dataset.col = String(col);
          th.textContent = schema.headerLabel || '';
          th.className = [
            'sheet-table-header relative sticky top-0 z-20 h-10 border-b border-r px-3 text-left text-xs font-semibold',
          ].join(' ');

          th.style.width = `${colWidths[col]}px`;
          th.style.minWidth = `${colWidths[col]}px`;
          th.style.maxWidth = `${colWidths[col]}px`;

          const handle = document.createElement('div');
          handle.className = 'resize-handle-col';
          th.appendChild(handle);
          setupColumnResize(handle, col);

          headRow.appendChild(th);
        }

        if (actionHeader) {
          headRow.appendChild(actionHeader);
        }

        tableHead.appendChild(headRow);
      }

      applyFixedColumnWidth('rowNumber', fixedRowNumberWidth);
      applyFixedColumnWidth('action', fixedActionWidth);

      appendRow();
      updateViewportSizing();
    }

    zoomRange.addEventListener('input', (event) => {
      setZoom(Number(event.target.value));
    });

    zoomInBtn.addEventListener('click', () => {
      setZoom(zoom + STEP_ZOOM_BUTTON);
    });

    zoomOutBtn.addEventListener('click', () => {
      setZoom(zoom - STEP_ZOOM_BUTTON);
    });

    if (viewportWidthRange) {
      viewportWidthRange.addEventListener('input', (event) => {
        viewportWidthPercent = Number(event.target.value || 100);
        updateViewportSizing();
      });
    }

    if (rowLimitSelect) {
      rowLimitSelect.addEventListener('change', (event) => {
        visibleRowLimit = Number(event.target.value || 5);
        updateViewportSizing();
      });
    }

    sheetViewport.addEventListener('wheel', (event) => {
      if (isMobileLayout()) return;
      if (!event.ctrlKey) return;
      event.preventDefault();

      const direction = event.deltaY < 0 ? 1 : -1;
      setZoom(zoom + direction * STEP_ZOOM_WHEEL);
    }, { passive: false });

    mobileZoomQuery.addEventListener('change', syncResponsiveZoomState);
    window.addEventListener('resize', syncResponsiveZoomState);

    // Bắt sự kiện action cho cả bảng desktop và form mobile để dùng chung 1 logic
    function handleActionButtonClick(event) {
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const action = button.dataset.action;
      const rowIndex = Number(button.dataset.row);
      if (Number.isNaN(rowIndex)) return;

      if (action === 'delete') {
        deleteRow(rowIndex);
      }
    }

    tableBody.addEventListener('click', handleActionButtonClick);
    mobileFormViewport.addEventListener('click', handleActionButtonClick);

    buildTable();
    syncResponsiveZoomState();
  </script>
</body>
</html>
